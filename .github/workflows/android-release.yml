name: Android Public Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Public release tag matching the Android Release preset
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: android-public-release
  cancel-in-progress: false

jobs:
  build:
    name: Verify and sign release APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-godot
        with:
          android-release: 'true'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools build-tools;36.0.0 platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - name: Check release version and source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools')
          from export_android import RELEASE_VERSION
          if os.environ['RELEASE_TAG'] != 'v' + RELEASE_VERSION:
              raise SystemExit('Tag must match the APK release version')
          PY
      - name: Import and run complete headless regression
        # Font metrics are part of the UI regression, even with a headless display.
        # Keep this environment consistent with Godot CI.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python tools/check.py
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          data = ''.join(os.environ['KEYSTORE_BASE64'].split())
          if not data:
              raise SystemExit('ANDROID_KEYSTORE_BASE64 is not configured')
          path = Path(os.environ['RUNNER_TEMP']) / 'wdfz-release.keystore'
          with path.open('xb') as f:
              path.chmod(0o600)
              f.write(base64.b64decode(data, validate=True))
          PY
      - name: Export, sign and verify release APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python tools/export_android.py --release --keystore "$RUNNER_TEMP/wdfz-release.keystore"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/wdfz-release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: android-public-release-${{ github.sha }}
          path: |
            build/packages/wdfz-0.1.0-android-arm64.apk
            build/packages/wdfz-0.1.0-android-arm64.apk.sha256
            build/packages/wdfz-0.1.0-android-arm64.build.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-android-release-${{ github.sha }}
          path: |
            build/reports/headless/
            build/reports/android-release/summary.json
            build/reports/android-release/manifest*.log
            build/reports/android-release/signature.log
            build/reports/android-release/alignment.log
          retention-days: 14

  publish:
    name: Publish verified public release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-public-release-${{ github.sha }}
          path: release-assets
      - name: Verify all assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python tools/publish_android_release.py --assets release-assets --tag "$RELEASE_TAG" --notes docs/releases/0.1.0.md
