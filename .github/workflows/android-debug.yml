name: Android Debug

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android debug APK (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-godot
        with:
          android-debug: 'true'
      - name: Set up Android SDK and build tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools build-tools;36.0.0 platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - name: Reuse the development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/wdfz-debug.keystore
          key: wdfz-android-debug-keystore-v1
      - name: Export and verify signed debug APK
        run: python tools/export_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: wdfz-android-debug-arm64-${{ github.sha }}
          path: |
            build/packages/wdfz-android-debug-arm64.apk
            build/packages/wdfz-android-debug-arm64.apk.sha256
            build/packages/wdfz-android-debug-arm64.build.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-android
          path: build/reports/android/
          retention-days: 14
