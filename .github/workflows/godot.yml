name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Structure and tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check.py --static-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-structure
          path: build/reports/
          retention-days: 14

  regression:
    name: Regression (${{ matrix.mode }})
    needs: structure
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        mode: [headless, windowed]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Install display runtime and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri fonts-noto-cjk
      - name: Import and run regression suite
        env:
          TEST_MODE: ${{ matrix.mode }}
        run: xvfb-run -a python tools/check.py --mode "$TEST_MODE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.mode }}
          path: build/reports/
          retention-days: 14

  desktop-build:
    name: Desktop builds
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          templates: 'true'
      - name: Export Linux and Windows; smoke-test Linux package
        run: python tools/export.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-builds-${{ github.sha }}
          path: build/packages/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-export
          path: build/reports/export/
          retention-days: 14
