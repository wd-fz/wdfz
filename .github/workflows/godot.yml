name: Godot framework

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Godot from the official release
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="$(cat .godot-version)"
          GODOT_ARCHIVE="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          GODOT_RELEASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$GODOT_RELEASE/$GODOT_ARCHIVE" -o "$RUNNER_TEMP/$GODOT_ARCHIVE"
          curl --fail --location --retry 3 "$GODOT_RELEASE/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot-sha512.txt"
          cd "$RUNNER_TEMP"
          awk -v file="$GODOT_ARCHIVE" '$2 == file {print}' godot-sha512.txt > godot-checksum.txt
          test -s godot-checksum.txt
          sha512sum --check godot-checksum.txt
          unzip -q "$GODOT_ARCHIVE" -d godot
          mv "godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot/godot
          chmod +x godot/godot
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Install the software-rendered window test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri fonts-noto-cjk
      - name: Import, enforce boundaries and run headless plus window regressions
        run: xvfb-run -a python tools/check.py --windowed
