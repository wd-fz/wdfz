name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Structure and tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check.py --static-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-structure
          path: build/reports/
          retention-days: 14

  regression:
    name: Regression (${{ matrix.name }})
    needs: structure
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: headless
            mode: headless
            renderer: forward_plus
          # Keep the existing required-check name for desktop windowed regression.
          - name: windowed
            mode: windowed
            renderer: forward_plus
          - name: Vulkan Mobile
            mode: windowed
            renderer: mobile
    env:
      # Mesa's Vulkan CPU device is deterministic and available on hosted runners.
      LP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - uses: ./.github/actions/setup-vulkan
      - name: Import and run regression suite
        env:
          TEST_MODE: ${{ matrix.mode }}
          TEST_RENDERER: ${{ matrix.renderer }}
        run: xvfb-run -a python tools/check.py --mode "$TEST_MODE" --renderer "$TEST_RENDERER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.mode }}-${{ matrix.renderer }}
          path: build/reports/
          retention-days: 14

  desktop-build:
    name: Desktop builds
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          templates: 'true'
      - uses: ./.github/actions/setup-vulkan
      - name: Export Linux and Windows; smoke-test Linux package with Vulkan
        run: xvfb-run -a python tools/export.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-builds-${{ github.sha }}
          path: build/packages/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-export
          path: build/reports/export/
          retention-days: 14
