name: Set up pinned Godot
description: Cache the official Linux editor and optional desktop release templates after SHA512 verification.
inputs:
  templates:
    description: Install Linux and Windows release export templates
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/wdfz-godot
        key: godot-${{ runner.os }}-${{ hashFiles('.godot-version') }}-templates-${{ inputs.templates }}-v1
    - name: Install verified Godot
      shell: bash
      env:
        INSTALL_TEMPLATES: ${{ inputs.templates }}
        GODOT_CACHE: ${{ runner.tool_cache }}/wdfz-godot
      run: |
        args=(--cache "$GODOT_CACHE")
        if [[ "$INSTALL_TEMPLATES" == true ]]; then args+=(--templates); fi
        python tools/ci/install_godot.py "${args[@]}"
